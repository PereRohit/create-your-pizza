spring.application.name=auth-service

# JWT identifiers (Build plan §2)
app.jwt.issuer=create-your-pizza-auth
app.jwt.audience=create-your-pizza-catalog
app.jwt.ttl=30m

# Datasource (Compose service auth-db; host override via SPRING_DATASOURCE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:auth}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:auth}

# HikariCP — explicit pool (Boot default is already Hikari; these tune it)
spring.datasource.hikari.pool-name=${SPRING_DATASOURCE_HIKARI_POOL_NAME:auth-pool}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}

# Flyway owns DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No default generated user (bootstrap prints the first admin instead)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server.port=${SERVER_PORT:8080}
