spring.datasource.url=jdbc:h2:mem:auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

app.jwt.issuer=create-your-pizza-auth
app.jwt.audience=create-your-pizza-catalog
app.jwt.ttl=30m

# SpringDoc (test-scoped) off unless Docker export sets springdoc.api-docs.enabled=true
springdoc.api-docs.enabled=false
