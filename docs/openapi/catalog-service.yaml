openapi: 3.1.0
info:
  title: CreateYourPizza Catalog API
  description: |
    Catalog-service API for CreateYourPizza.

    **JSON envelope** (JSON responses): `status`, `message`, `error`, `data`, and optionally `pagination` on list endpoints.

    **Pagination** (`GET /api/products` only): default page size **10**, max **100**; `pagination.current`, `pagination.next` (**-1** when no next page), `pagination.total`. Options are get-by-id only (no list/pagination).

    **503 Service Busy:** while the Redis PDF-generation lock is held, catalog **writes** return HTTP **503** with envelope `message=please try after sometime`, `error=system busy`, and header `Retry-After: 60`. See response component `ServiceBusy`.

    **Public PDF:** `GET /api/menu.pdf` returns **raw PDF binary** (not JSON). Omit `version` for latest (Redis); `?version=N` loads history from the catalog DB. Unknown / missing version → JSON **404** envelope.

    **JWT:** verify via JWKS at auth-service (`AUTH_JWKS_URL`). Reads need `catalog:read`; writes need `catalog:write` **and** `ADMIN` role.
  version: "1.0"
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerJwt: []
paths:
  /api/products/{id}:
    get:
      tags:
      - product-query-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeProductResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
      - product-write-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWriteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceBusy"
    delete:
      tags:
      - product-write-controller
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeVoid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceBusy"
  /api/options/{id}:
    get:
      tags:
      - option-query-controller
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeOptionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
      - option-write-controller
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionWriteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeOptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceBusy"
    delete:
      tags:
      - option-write-controller
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeVoid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceBusy"
  /api/products:
    get:
      tags:
      - product-query-controller
      operationId: list
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: maxPrice
        in: query
        required: false
        schema:
          type: number
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeListObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
      - product-write-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWriteRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceBusy"
  /api/options:
    post:
      tags:
      - option-write-controller
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionWriteRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeOptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceBusy"
  /api/menu.pdf:
    get:
      tags:
      - menu-pdf-controller
      operationId: get_2
      parameters:
      - name: version
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "Menu PDF bytes — latest version, or the version named by the\
            \ version query parameter"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    Pagination:
      type: object
      description: List pagination metadata
      properties:
        current:
          type: integer
          format: int32
          description: Current page (0-based)
        next:
          type: integer
          format: int32
          description: "Next page index, or -1 if none"
        total:
          type: integer
          format: int64
          description: Total matching items
    ProductWriteRequest:
      type: object
      properties:
        productName:
          type: string
          minLength: 1
        productType:
          type: string
          minLength: 1
        productCategory:
          type: string
          minLength: 1
        productPrice:
          type: number
          minimum: 0
        optionsEnabled:
          type: boolean
        customisationNotes:
          type: string
        active:
          type: boolean
        simpleIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - productCategory
      - productName
      - productPrice
      - productType
    ApiEnvelopeProductResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        error:
          type: string
        data:
          $ref: "#/components/schemas/ProductResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ProductResponse:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        productType:
          type: string
        productCategory:
          type: string
        productPrice:
          type: number
        optionsEnabled:
          type: boolean
        customisationNotes:
          type: string
        active:
          type: boolean
        simpleIds:
          type: array
          items:
            type: string
            format: uuid
        productCreatedAt:
          type: string
          format: date-time
        productUpdatedAt:
          type: string
          format: date-time
    OptionWriteRequest:
      type: object
      properties:
        optionKind:
          type: string
          minLength: 1
        productName:
          type: string
          minLength: 1
        productPrice:
          type: number
          minimum: 0
        isBase:
          type: boolean
      required:
      - isBase
      - optionKind
      - productName
      - productPrice
    ApiEnvelopeOptionResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        error:
          type: string
        data:
          $ref: "#/components/schemas/OptionResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"
    OptionResponse:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        productType:
          type: string
        productPrice:
          type: number
        optionKind:
          type: string
        productCreatedAt:
          type: string
          format: date-time
        productUpdatedAt:
          type: string
          format: date-time
        base:
          type: boolean
        isBase:
          type: boolean
    ApiEnvelopeListObject:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        error:
          type: string
        data:
          type: array
          items: {}
        pagination:
          $ref: "#/components/schemas/Pagination"
    ApiEnvelopeVoid:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        error:
          type: string
        data: {}
        pagination:
          $ref: "#/components/schemas/Pagination"
    ApiEnvelope:
      type: object
      description: Standard JSON response envelope
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code echoed in body
        message:
          type: string
          description: Human-readable message; success → "success"
        error:
          type: string
          description: Error detail; empty string on success
        data:
          type: object
          description: Payload; null on pure errors
        pagination:
          $ref: "#/components/schemas/Pagination"
          description: Present only on list JSON responses
  responses:
    BadRequest:
      description: "Request body failed validation, or a catalog rule rejected it"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
          example: "{\"status\":400,\"message\":\"Validation failed\",\"error\":\"\
            Validation failed\"}"
    Unauthorized:
      description: "Missing, malformed, or expired JWT"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
          example: "{\"status\":401,\"message\":\"Unauthorized\",\"error\":\"Unauthorized\"\
            }"
    Forbidden:
      description: "Authenticated but not permitted — reads need scope catalog:read,\
        \ writes need catalog:write and role ADMIN"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
          example: "{\"status\":403,\"message\":\"Forbidden\",\"error\":\"Forbidden\"\
            }"
    NotFound:
      description: "No such product, option, or menu version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
          example: "{\"status\":404,\"message\":\"Product not found\",\"error\":\"\
            Product not found\"}"
    ServiceBusy:
      description: PDF generation lock held — retry after Retry-After seconds. The
        envelope omits data and pagination.
      headers:
        Retry-After:
          description: Seconds to wait before retry (always 60)
          schema:
            type: integer
            format: int32
            default: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
          example: "{\"status\":503,\"message\":\"please try after sometime\",\"error\"\
            :\"system busy\"}"
  securitySchemes:
    bearerJwt:
      type: http
      description: JWT from auth-service (admin login or trusted /auth/token)
      name: bearerJwt
      scheme: bearer
      bearerFormat: JWT
