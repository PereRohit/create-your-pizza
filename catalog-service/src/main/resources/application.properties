# JWT identifiers (Build plan §2) — catalog verifies iss/aud locally via JWKS
app.jwt.issuer=create-your-pizza-auth
app.jwt.audience=create-your-pizza-catalog
app.jwt.ttl=30m

# MUST defaults (Build plan §7)
app.pdf.interval=5m
app.cache.catalog-ttl=3m
app.lock.pdf-ttl=120s
app.lock.write-ttl=30s

# Datasource (Compose service catalog-db; host mapped on 5433)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/catalog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:catalog}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:catalog}

# Redis (Compose service redis)
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}

# Catalog JWKS URL placeholder (Compose: http://auth-service:8080/...)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URL:http://localhost:8080/auth/.well-known/jwks.json}

server.port=${SERVER_PORT:8081}
