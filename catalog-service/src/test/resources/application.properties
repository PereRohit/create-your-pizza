spring.datasource.url=jdbc:h2:mem:catalog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.autoconfigure.exclude=\
org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Resource Server on; JWKS URI overridden in security tests via local HttpServer
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:9/jwks
app.jwt.issuer=create-your-pizza-auth
app.jwt.audience=create-your-pizza-catalog
app.jwt.ttl=30m
app.jwt.jwks-warmup=false
app.pdf.interval=5m
app.cache.catalog-ttl=3m
app.lock.pdf-ttl=120s
app.lock.write-ttl=30s
